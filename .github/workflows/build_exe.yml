name: Build and Release PDF Master

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install Pillow

    - name: Generate App Icon
      run: python assets/create_icon.py

    - name: Build with PyInstaller (onedir)
      run: pyinstaller PDFMaster_App.spec --noconfirm

    - name: Verify PyInstaller Output
      run: Get-ChildItem dist\PDFMaster_App | Select-Object -First 10

    - name: Set Version String
      id: version
      shell: pwsh
      run: |
        $date = Get-Date -Format "yyyy.MM.dd"
        $run  = "${{ github.run_number }}"
        $ver  = "v$date.$run"
        echo "tag=$ver"       >> $env:GITHUB_OUTPUT
        echo "display=$ver"   >> $env:GITHUB_OUTPUT
        echo "APP_VERSION=$ver" >> $env:GITHUB_ENV

    - name: Build Installer with Inno Setup
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $iscc installer\PDFMaster_Setup.iss
      shell: pwsh

    - name: Verify Installer
      run: Get-ChildItem installer\output

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "PDF Master ${{ steps.version.outputs.display }}"
        body: |
          ## PDF Master — Build automático

          **Versión:** ${{ steps.version.outputs.display }}
          **Commit:** ${{ github.sha }}

          ### Instalación
          1. Descarga `PDFMaster_Setup.exe`
          2. Ejecuta el instalador — **no requiere contraseña de administrador**
          3. Se instala en tu carpeta de usuario

          ### Cambios
          ${{ github.event.head_commit.message }}
        files: installer/output/PDFMaster_Setup.exe
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
